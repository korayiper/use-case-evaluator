[project]
name = "use-case-evaluator"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.1",
    "dynaconf>=3.3.3",
    "fastapi>=0.139.2",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
# Only needed when running with DB_BACKEND=mssql (prod). Also requires the
# "ODBC Driver 18 for SQL Server" installed at the OS level - `pip`/`uv`
# alone won't provide that.
mssql = ["pyodbc>=5.1.0"]
