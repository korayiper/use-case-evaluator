<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Priorisierte Anwendungsfälle</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ static_version }}">
</head>
<body>
<header class="page-header no-print">
    <h1>Priorisierte Anwendungsfälle</h1>
    <div class="header-actions">
        <a class="btn btn-ghost" href="{{ request.scope.get('root_path', '') }}/">&larr; Zurück zur Übersicht</a>
        <button type="button" id="print-btn" class="btn btn-primary">Drucken / Als PDF speichern</button>
    </div>
</header>

<main class="page-content">
    <h1 class="print-only">Priorisierte Anwendungsfälle</h1>
    <p class="muted-text" id="print-summary"></p>
    <div class="table-scroll">
        <table id="print-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Ideengeber</th>
                <th>Nutzungskategorie</th>
                <th>Wirtschaftlicher Nutzen</th>
                <th>Priorität</th>
                <th>Entwicklungsdauer</th>
                <th>Go-Live</th>
                <th>Priorisiert</th>
            </tr>
            </thead>
            <tbody id="print-tbody"></tbody>
        </table>
    </div>
    <p class="empty-state" id="print-empty" hidden>Keine priorisierten Anwendungsfälle vorhanden.</p>
</main>

<script>
  window.ROOT_PATH = "{{ request.scope.get('root_path', '') }}";
  window.API_BASE = window.ROOT_PATH + "/api";
</script>
<script src="{{ url_for('static', path='common.js') }}?v={{ static_version }}"></script>
<script src="{{ url_for('static', path='prioritized_print.js') }}?v={{ static_version }}"></script>
</body>
</html>
