    <section id="add-panel" class="panel" hidden>
        <h2 id="add-panel-title">Neuer Anwendungsfall</h2>
        <form id="add-form" novalidate>
            <div class="field-grid">
                <div class="field">
                    <label for="f-name">Name</label>
                    <input id="f-name" name="name" type="text" required maxlength="200"
                           placeholder="z. B. Rechnungsdatenerkennung">
                </div>
                <div class="field">
                    <label for="f-idea-initiator">Ideengeber</label>
                    <input id="f-idea-initiator" name="idea_initiator" type="text" required maxlength="200"
                           placeholder="z. B. Team Finanzen">
                </div>
            </div>
            <div class="field">
                <label for="f-description">Beschreibung des Anwendungsfalls <span
                        class="optional">(optional)</span></label>
                <textarea id="f-description" name="description" rows="2"></textarea>
                <p class="muted-text">Tipp: Zeilen mit „- " werden als Aufzählung angezeigt.</p>
            </div>
            <div class="field">
                <label for="f-value-added-description">Beschreibung der Breitenwirkung/Kultur <span
                        class="optional">(optional)</span></label>
                <textarea id="f-value-added-description" name="value_added_description" rows="2"></textarea>
                <p class="muted-text">Tipp: Zeilen mit „- " werden als Aufzählung angezeigt.</p>
            </div>
            <div class="field">
                <label for="f-depends-on">Abhängig von <span class="optional">(optional)</span></label>
                <div id="f-depends-on"></div>
            </div>
            <div class="field-grid">
                <div class="field">
                    <div class="field-label-row">
                        <label for="f-use-category">Nutzungskategorie</label>
                        <button type="button" class="help-btn" data-help="use_category"
                                data-panel="help-panel-form-use_category" hidden>Was bedeutet das?
                        </button>
                    </div>
                    <select id="f-use-category" name="use_category" required></select>
                    <div class="help-panel" id="help-panel-form-use_category" hidden></div>
                </div>
                <div class="field">
                    <div class="field-label-row">
                        <label for="f-value-added">Breitenwirkung/Kultur</label>
                        <button type="button" class="help-btn" data-help="value_added"
                                data-panel="help-panel-form-value_added" hidden>Was bedeutet das?</button>
                    </div>
                    <select id="f-value-added" name="value_added" required></select>
                    <div class="help-panel" id="help-panel-form-value_added" hidden></div>
                </div>
                <div class="field">
                    <div class="field-label-row">
                        <label for="f-development-time">Entwicklungsdauer</label>
                        <button type="button" class="help-btn" data-help="development_time"
                                data-panel="help-panel-form-development_time" hidden>Was bedeutet das?
                        </button>
                    </div>
                    <select id="f-development-time" name="development_time" required></select>
                    <div class="help-panel" id="help-panel-form-development_time" hidden></div>
                </div>
                <div class="field">
                    <div class="field-label-row">
                        <label for="f-process-criticality">Prozesskritikalität</label>
                        <button type="button" class="help-btn" data-help="process_criticality"
                                data-panel="help-panel-form-process_criticality" hidden>Was bedeutet
                            das?
                        </button>
                    </div>
                    <select id="f-process-criticality" name="process_criticality" required></select>
                    <div class="help-panel" id="help-panel-form-process_criticality" hidden></div>
                </div>
                <div class="field">
                    <div class="field-label-row">
                        <label for="f-process-dependency">Prozessabhängigkeit</label>
                        <button type="button" class="help-btn" data-help="process_dependency"
                                data-panel="help-panel-form-process_dependency" hidden>Was bedeutet das?
                        </button>
                    </div>
                    <select id="f-process-dependency" name="process_dependency" required></select>
                    <div class="help-panel" id="help-panel-form-process_dependency" hidden></div>
                </div>
                <div class="field">
                    <div class="field-label-row">
                        <label for="f-ai-feasibility">KI-Umsetzbarkeit</label>
                        <button type="button" class="help-btn" data-help="ai_feasibility"
                                data-panel="help-panel-form-ai_feasibility" hidden>Was bedeutet das?
                        </button>
                    </div>
                    <select id="f-ai-feasibility" name="ai_feasibility" required></select>
                    <div class="help-panel" id="help-panel-form-ai_feasibility" hidden></div>
                </div>
                <div class="field">
                    <label for="f-golive-date">Go-Live-Datum</label>
                    <input id="f-golive-date" name="golive_date" type="date" required>
                </div>
            </div>
            <p id="form-error" class="form-error" hidden></p>
            <div class="form-actions">
                <button type="button" id="cancel-add" class="btn btn-ghost">Abbrechen</button>
                <button type="submit" id="submit-add" class="btn btn-primary">Anwendungsfall speichern</button>
            </div>
        </form>
    </section>
