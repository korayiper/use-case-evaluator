# Non-secret configuration. Credentials go in .secrets.toml instead (see
# .secrets.toml.example) - never put a password or connection string here.
#
# Active section is chosen by ENV_FOR_DYNACONF (default "development").
# [default] is always merged in underneath whichever section is active.

[default]
db_backend = "sqlite"
sqlite_path = "usecases.db"

# nginx (or whatever sits in front in prod) authenticates the user and sets
# this header before the request reaches the app - see auth.py. Phase 1:
# who can create/edit/delete is just this hardcoded list of a-numbers,
# everyone else gets read-only. Edit this list to add/remove writers.
remote_user_header = "X-Remote-User"
writer_users = ["a20779"]

# Phase 1 (same pattern as writer_users): who's on the prio board, and which
# of the six departments (auth.DEPARTMENTS) each one represents - each
# department gets exactly one vote per use case, cast by whoever from that
# department is listed here. Multiple users may share a department (any of
# them can cast that department's vote). directors_users may drag-reorder
# the board once the prio board has handed it off - see auth.py.
prioboard_users = [
    { user = "a20779", department = "DDIR" },
    { user = "a20779", department = "UDIR" },
    { user = "a20779", department = "CDIR" },
    { user = "a20779", department = "FDIR" },
    { user = "a20779", department = "PDIR" },
    { user = "a20779", department = "KDIR" },
]
directors_users = ["a20779"]

[development]
db_backend = "sqlite"
# No reverse proxy locally, so nothing sets X-Remote-User - this stands in
# for it so the app has an identity to work with when testing.
dev_user = "a20779"

[production]
db_backend = "mssql"
mssql_driver = "ODBC Driver 18 for SQL Server"